<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hw</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-800 font-sans antialiased">
  <section class="relative min-h-screen bg-[#252B42] text-white overflow-hidden flex flex-col justify-between">
    
    <div class="absolute inset-0 z-0">
      <img src="./img1.jpg" alt="Doctors" class="w-full h-full object-cover object-left md:object-center opacity-40 mix-blend-luminosity" />
      <div class="absolute inset-0 bg-gradient-to-r from-[#252B42]/90 via-[#252B42]/70 to-[#252B42]/90"></div>
    </div>

    <header class="relative z-10 max-w-7xl w-full mx-auto px-6 py-6 flex items-center justify-between">
      <div class="flex items-center space-x-12">
        <a href="#" class="block">
          <img src="./logo.png" alt="Physionic Logo" class="h-8 object-contain" />
        </a>
        <nav class="hidden md:flex items-center space-x-6 text-sm font-semibold text-slate-300">
          <a href="#" class="hover:text-white transition-colors">Home</a>
          <a href="#" class="hover:text-white transition-colors">Product</a>
          <a href="#" class="hover:text-white transition-colors">Pricing</a>
          <a href="#" class="hover:text-white transition-colors">Contact</a>
        </nav>
      </div>
      <a href="#" class="bg-[#23A6F0] hover:bg-[#1a8cd4] text-white text-sm font-bold px-6 py-3 rounded-md transition-all flex items-center space-x-2 shadow-md">
        <span>Get Quote Now</span>
        <span>&rarr;</span>
      </a>
    </header>
    <div class="relative z-10 max-w-7xl w-full mx-auto px-6 py-12 my-auto grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
      
      <div class="lg:col-span-7 space-y-6">
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight">
          Meet the Best <br />
          Hospital
        </h1>
        <p class="text-slate-300 text-base sm:text-lg max-w-md font-normal leading-relaxed">
          We know how large objects will act, but things on a small scale.
        </p>
        <div class="flex flex-wrap gap-4 pt-2">
          <a href="#" class="bg-[#23A6F0] hover:bg-[#1a8cd4] text-white font-bold text-sm px-8 py-3.5 rounded-md transition-all shadow-md">
            Get Quote Now
          </a>
          <a href="#" class="border border-white/40 hover:bg-white/10 text-white font-bold text-sm px-8 py-3.5 rounded-md transition-all">
            Learn More
          </a>
        </div>
      </div>

      <div class="lg:col-span-5 bg-white text-slate-800 p-8 rounded-2xl shadow-2xl">
        <h3 class="text-2xl font-bold text-center text-[#252B42] mb-6">
          Book Appointment
        </h3>

        <form class="space-y-4" onsubmit="event.preventDefault();">
          <div>
            <label class="block text-xs font-bold text-[#252B42] mb-1.5">Name *</label>
            <input 
              type="text" 
              placeholder="Full Name *" 
              required 
              class="w-full px-4 py-3 bg-[#F9F9F9] border border-slate-200 rounded-md text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus:border-[#23A6F0]"
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-[#252B42] mb-1.5">Email address *</label>
            <input 
              type="email" 
              placeholder="example@gmail.com" 
              required 
              class="w-full px-4 py-3 bg-[#F9F9F9] border border-slate-200 rounded-md text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus:border-[#23A6F0]"
            />
          </div>

     
          <div>
            <label class="block text-xs font-bold text-[#252B42] mb-1.5">Department *</label>
            <select required class="w-full px-4 py-3 bg-[#F9F9F9] border border-slate-200 rounded-md text-sm text-slate-400 focus:outline-none focus:border-[#23A6F0] appearance-none">
              <option value="" disabled selected>Please Select</option>
              <option value="cardiology" class="text-slate-800">Cardiology</option>
              <option value="neurology" class="text-slate-800">Neurology</option>
              <option value="pediatrics" class="text-slate-800">Pediatrics</option>
            </select>
          </div>

      
          <div>
            <label class="block text-xs font-bold text-[#252B42] mb-1.5">Time *</label>
            <select required class="w-full px-4 py-3 bg-[#F9F9F9] border border-slate-200 rounded-md text-sm text-slate-400 focus:outline-none focus:border-[#23A6F0] appearance-none">
              <option value="" disabled selected>4:00 Available</option>
              <option value="09:00" class="text-slate-800">9:00 AM</option>
              <option value="12:00" class="text-slate-800">12:00 PM</option>
              <option value="16:00" class="text-slate-800">4:00 PM</option>
            </select>
          </div>

   
          <div class="pt-2">
            <button 
              type="submit" 
              class="w-full bg-[#23A6F0] hover:bg-[#1a8cd4] text-white font-bold py-3.5 rounded-md text-sm transition-colors shadow-md">
              Book Appointment
            </button>
          </div>
        </form>
      </div>

    </div>

   
    <div class="py-4"></div>
  </section>

</body>
</html>
